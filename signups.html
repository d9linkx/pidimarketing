<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started | For Creators & Performers</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #3ecf8e;
            --dark: #1c1c1c;
            --light: #f4f4f4;
            --error: #ff4d4d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .signup-container {
            background: #2a2a2a;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 420px;
        }

        h2 { text-align: center; margin-bottom: 1.5rem; font-weight: 700; }
        p.subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-top: -1rem; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.2rem; }

        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1c1c1c;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: var(--dark);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #555; cursor: not-allowed; }

        #message {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <h2>Secure Signup</h2>
    <p class="subtitle">Your secret number is hashed before storage</p>
    
    <form id="signupForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your name" required>
        </div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        
        <div class="form-group">
            <label>Role</label>
            <select id="role" required>
                <option value="Creator">Creator</option>
                <option value="Performer">Performer</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Secret 6-Digit Number</label>
            <input type="password" id="secretNumber" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="******" required>
        </div>
        
        <button type="submit" id="submitBtn">Create Account</button>
    </form>
    
    <div id="message"></div>
</div>

<script>
    // 1. Supabase Configuration
    const SUPABASE_URL = 'https://wamtgsqxhapgxnlvxvez.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhbXRgc3F4aGFwZ3hubHZ4dmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTQ0NjcsImV4cCI6MjA5MzIzMDQ2N30.-BxFkAZlEPigJ5GNiKs-i2Kf4cpgvwDt2Srh9OQ4gWY';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Hashing function (SHA-256)
    async function hashNumber(number) {
        const encoder = new TextEncoder();
        const data = encoder.encode(number);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const form = document.getElementById('signupForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // UI Feedback
        submitBtn.disabled = true;
        messageDiv.innerText = "Securing your data...";
        messageDiv.style.color = "white";
        messageDiv.style.background = "transparent";

        try {
            const rawNumber = document.getElementById('secretNumber').value;
            
            // Generate the hash before sending
            const hashedNumber = await hashNumber(rawNumber);

            const formData = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value,
                secret_number: hashedNumber 
            };

            const { data, error } = await _supabase
                .from('signups')
                .insert([formData]);

            if (error) throw error;

            // Success UI
            messageDiv.innerText = "Success! Account secured and created.";
            messageDiv.style.color = "#3ecf8e";
            messageDiv.style.background = "rgba(62, 207, 142, 0.1)";
            form.reset();

        } catch (err) {
            // Error UI
            messageDiv.innerText = "Error: " + err.message;
            messageDiv.style.color = var(--error);
            messageDiv.style.background = "rgba(255, 77, 77, 0.1)";
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
