<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PIDI Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-dash: #b5b5b5;
            --text-primary: #1a1d23;
            --text-secondary: #9ca3af;
            --nav-bg: #ffffff;
            --btn-secondary: #f1f5f9;
        }
        body.dark-mode {
            --bg-body: #09090b;
            --bg-card: #18181b;
            --border-dash: #27272a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --nav-bg: #18181b;
            --btn-secondary: #27272a;
        }
        body.light-mode {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-dash: #e2e8f0;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --nav-bg: #edf2f7;
            --btn-secondary: #e2e8f0;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-body); color: var(--text-primary); transition: background-color 0.3s ease, color 0.3s ease; max-width: 100vw; overflow-x: hidden; }
        .bento-card { background: var(--bg-card); border: 1px solid var(--border-dash); border-radius: 24px; padding: 2rem; transition: all 0.3s ease; }
        .accent-gradient { 
            background: linear-gradient(135deg, #45b96e 60%, #3daf65 40%); 
            color: #0f172a !important;
            border: 1px solid #45b96e !important;
            transition: background 0.5s ease, transform 0.2s ease;
        }
        .accent-gradient:hover {
            background: linear-gradient(135deg, #45b96e 60%, #14913f 40%); 
            transform: scale(1.05);
        }
        .text-dash-secondary { color: var(--text-secondary) !important; }
        .bg-dash-secondary { background-color: var(--btn-secondary); }
        .nav-container { background-color: var(--nav-bg); border: 1px solid var(--border-dash); }
        .active-role { background-color: white !important; color: black !important; }
        body.light-mode .active-role { background-color: #111111 !important; color: white !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="flex justify-between items-center mb-8 gap-4">
            <div class="mb-8">
                <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                    <img id="logo-img" src="assets/dashblack.png" alt="PIDItasks Logo" class="h-8 w-auto logo-img">
                </a>
            </div>
            
        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-dash-secondary border border-dash flex items-center justify-center hover:border-[#6a26da] transition" id="theme-toggle" title="Switch Theme (System / Light / Dark)">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto mt-12 md:mt-24" id="signup-main">
        <div class="bento-card">
            <div id="signup-message" class="hidden p-3 rounded-xl text-sm mb-4 text-center"></div>
            <div class="mb-8">
                <h2 class="text-3xl font-bold tracking-tight">Create your account</h2>
                <p class="text-dash-secondary mt-2">Join the future of performance marketing.</p>
            </div>

            <form onsubmit="handleSignup(event)" method="POST" class="space-y-5">
                <div>
                    <label for="signup-fullname" class="block text-[10px] uppercase font-bold text-dash-secondary tracking-widest mb-1.5 px-1">Full Name</label>
                    <!-- name="full_name" matches the DB column `full_name` -->
                    <input name="full_name" type="text" id="signup-fullname" placeholder="Prince Dike" required class="w-full bg-dash-secondary border border-dash rounded-xl p-3 text-sm focus:outline-none focus:border-[#6a26da] transition">
                </div>
                
                <div>
                    <label for="signup-email" class="block text-[10px] uppercase font-bold text-dash-secondary tracking-widest mb-1.5 px-1">Email Address</label>
                    <!-- name="email" matches the DB column `email` -->
                    <input name="email" type="email" id="signup-email" placeholder="name@company.com" required class="w-full bg-dash-secondary border border-dash rounded-xl p-3 text-sm focus:outline-none focus:border-[#6a26da] transition">
                </div>

                <div>
                    <label class="block text-[10px] uppercase font-bold text-dash-secondary tracking-widest mb-1.5 px-1">Primary Mode</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectRole('creator')" id="role-creator" class="p-3 rounded-xl border border-dash text-sm font-bold transition hover:border-[#6a26da] active-role">Creator</button>
                        <button type="button" onclick="selectRole('performer')" id="role-performer" class="p-3 rounded-xl border border-dash text-sm font-bold transition hover:border-[#6a26da] text-dash-secondary">Performer</button>
                    </div>
                    <!-- name="user_role" matches the DB column `user_role` -->
                    <input name="user_role" type="hidden" id="selected-role" value="creator">
                </div>

                <div>
                    <label for="signup-password" class="block text-[10px] uppercase font-bold text-dash-secondary tracking-widest mb-1.5 px-1">Password</label>
                    <div class="relative">
                        <input type="password" id="signup-password" placeholder="••••••••" required class="w-full bg-dash-secondary border border-dash rounded-xl p-3 pr-12 text-sm focus:outline-none focus:border-[#6a26da] transition">
                        <button type="button" onclick="togglePassword('signup-password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-dash-secondary hover:text-[#6a26da] transition focus:outline-none">
                            <i class="fa-solid fa-eye" id="toggle-icon-signup-password"></i>
                        </button>
                    </div>
                </div>


                <button type="submit" class="w-full accent-gradient py-4 rounded-2xl font-bold text-sm shadow-lg hover:scale-[1.02] transition active:scale-[0.98] mt-4">
                    Create Account
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-dash text-center">
                <p class="text-sm text-dash-secondary">
                    Already have an account? 
                    <a href="login.html" class="text-[var(--text-primary)] font-bold hover:text-[#6a26da] transition ml-1">Log in here</a>
                </p>
                <div class="mt-4">
                    <a href="index.html" class="text-xs text-dash-secondary hover:text-[#6a26da] transition">
                        <i class="fa-solid fa-arrow-left text-[10px] mr-1"></i> Return to Website
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { account, databases, ID, APPWRITE_CONFIG } from './appwriteClient.js';

        // Helper functions
        const displayAuthMessage = (elementId, message, type = 'info') => {
            const msgDiv = document.getElementById(elementId);
            if (!msgDiv) return;
            msgDiv.className = `p-3 rounded-xl text-sm mb-4 text-center ${type === 'success' ? 'bg-green-100 text-green-800' : type === 'error' ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800'}`;
            msgDiv.innerHTML = message;
            msgDiv.classList.remove('hidden');
        };

        const setButtonLoading = (button, isLoading, text) => {
            button.disabled = isLoading;
            button.innerHTML = isLoading ? `<i class="fa-solid fa-spinner fa-spin mr-2"></i> ${text}` : text;
        };

        const selectRole = (role) => {
            document.getElementById('role-creator').className = `p-3 rounded-xl border border-dash text-sm font-bold transition hover:border-[#6a26da] ${role === 'creator' ? 'active-role' : 'text-dash-secondary'}`;
            document.getElementById('role-performer').className = `p-3 rounded-xl border border-dash text-sm font-bold transition hover:border-[#6a26da] ${role === 'performer' ? 'active-role' : 'text-dash-secondary'}`;
            document.getElementById('selected-role').value = role;
        }

        const togglePassword = (id) => {
            const input = document.getElementById(id);
            const icon = document.getElementById('toggle-icon-' + id);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            icon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        };

        window.applyTheme = function() {
            const theme = localStorage.getItem('theme') || 'system';
            const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = theme === 'dark' || (theme === 'system' && isSystemDark);
            
            document.body.classList.toggle('dark-mode', isDark);
            document.body.classList.toggle('light-mode', !isDark);
            
            updateThemeIcon(theme);
            updateLogo(isDark);
        };

        window.toggleTheme = function() {
            const themes = ['system', 'light', 'dark'];
            const current = localStorage.getItem('theme') || 'system';
            const next = themes[(themes.indexOf(current) + 1) % themes.length];
            
            localStorage.setItem('theme', next);
            window.applyTheme();
        };

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if ((localStorage.getItem('theme') || 'system') === 'system') {
                window.applyTheme();
            }
        });

        window.updateThemeIcon = function(theme) {
            const icon = document.querySelector('#theme-icon');
            if (!icon) return;
            let iconClass = theme === 'light' ? 'fa-sun' : (theme === 'dark' ? 'fa-moon' : 'fa-desktop');
            icon.className = `fa-solid ${iconClass}`;
        };

        window.updateLogo = function(isDark) {
            const logo = document.getElementById('logo-img');
            if (!logo) return;
            logo.src = isDark ? 'assets/dashwhite.png' : 'assets/dashblack.png';
        };

        async function handleSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('signup-fullname').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const role = document.getElementById('selected-role').value;
            const submitButton = e.target.querySelector('button[type="submit"]');

            setButtonLoading(submitButton, true, 'Creating account...');
            displayAuthMessage('signup-message', 'Processing...', 'info');

            try {
                // Proactively clear any existing session to prevent "prohibited" errors
                try {
                    await account.deleteSession('current');
                } catch (e) {
                    // Silently ignore if no session exists
                }

                // 1. Create Auth Account
                const user = await account.create(ID.unique(), email, password, fullName);
                
                // 2. Create Session
                await account.createEmailPasswordSession(email, password);

                // 3. Create Profile Document (Replaces SQL Trigger)
                await databases.createDocument(
                    APPWRITE_CONFIG.DATABASE_ID,
                    APPWRITE_CONFIG.COLLECTIONS.PROFILES,
                    user.$id, // Use user ID as Document ID
                    {
                        full_name: fullName,
                        email: email,
                        user_role: role,
                        balance: 0,
                        allocated_funds: 0,
                        pending_balance: 0,
                        completed_tasks: 0,
                        created_at: new Date().toISOString()
                    }
                );

                displayAuthMessage('signup-message', 'Success! Redirecting...', 'success');
                setTimeout(() => window.location.href = `dashboard.html?view=${role}`, 1000);
            } catch (error) {
                console.error('Appwrite Signup Error:', error);
                let errorMessage = `Error: ${error.message}`;
                
                // Handle the "User already exists" error (Appwrite error code 409)
                if (error.code === 409) {
                    errorMessage = "An account with this email already exists. Please <a href='login.html' class='font-bold underline'>log in here</a>.";
                }
                
                displayAuthMessage('signup-message', errorMessage, 'error');
            } finally {
                setButtonLoading(submitButton, false, 'Create Account');
            }
        }


        // Global exposing for HTML onclicks
        window.selectRole = selectRole;
        window.handleSignup = handleSignup;
        window.toggleTheme = toggleTheme;
        window.togglePassword = togglePassword;

    // Initialize theme
    window.applyTheme();
    </script>
</body>
</html>
