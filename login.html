<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | PIDItasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-dash: #b5b5b5;
            --text-primary: #1a1d23;
            --text-secondary: #9ca3af;
            --nav-bg: #ffffff;
            --btn-secondary: #f1f5f9;
        }
        body.light-mode {
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --border-dash: #e2e8f0;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --nav-bg: #edf2f7;
            --btn-secondary: #e2e8f0;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-body); color: var(--text-primary); transition: background-color 0.3s ease, color 0.3s ease; max-width: 100vw; overflow-x: hidden; }
        .bento-card { background: var(--bg-card); border: 1px solid var(--border-dash); border-radius: 24px; padding: 2rem; transition: all 0.3s ease; }
        .accent-gradient { 
            background: linear-gradient(135deg, #45b96e 60%, #3daf65 40%); 
            color: #0f172a !important;
            border: 1px solid #45b96e !important;
            transition: background 0.5s ease, transform 0.2s ease;
        }
        .accent-gradient:hover {
            background: linear-gradient(135deg, #45b96e 60%, #14913f 40%); 
            transform: scale(1.05);
        }
        .text-dash-secondary { color: var(--text-secondary) !important; }
        .bg-dash-secondary { background-color: var(--btn-secondary); }
        .border-dash { border-color: var(--border-dash) !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="flex justify-between items-center mb-8 gap-4">
        <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <img id="logo-img" src="assets/pidiblack.png" alt="PIDI Logo" class="h-12 w-auto">
            <h1 class="text-normal text-2xl font-bold tracking-tight">PIDItasks</h1>
        </a>
        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-dash-secondary border border-dash flex items-center justify-center hover:border-[#6a26da] transition" id="theme-toggle">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto mt-12 md:mt-24" id="login-main">
        <div class="bento-card">
            <div id="login-message" class="hidden p-3 rounded-xl text-sm mb-4 text-center"></div>
            <div class="mb-10">
                <h2 class="text-3xl font-bold tracking-tight">Welcome back</h2>
                <p class="text-dash-secondary mt-2">Access your workspace.</p>
            </div>

            <form onsubmit="handleAuthAction(event)" class="space-y-6">
                <div>
                    <label for="login-email" class="block text-[10px] uppercase font-bold text-dash-secondary tracking-widest mb-1.5 px-1">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@company.com" required class="w-full bg-dash-secondary border border-dash rounded-xl p-3.5 text-sm focus:outline-none focus:border-[#6a26da] transition">
                </div>

                <div id="password-field">
                    <div class="flex justify-between items-center mb-1.5 px-1">
                        <label for="login-password" class="block text-[10px] uppercase font-bold text-dash-secondary tracking-widest">Password</label>
                        <a href="#" class="text-[10px] uppercase font-bold text-[#6a26da] tracking-widest">Forgot?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="login-password" placeholder="••••••••" required class="w-full bg-dash-secondary border border-dash rounded-xl p-3.5 pr-12 text-sm focus:outline-none focus:border-[#6a26da] transition">
                        <button type="button" onclick="togglePassword('login-password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-dash-secondary hover:text-[#6a26da] transition focus:outline-none">
                            <i class="fa-solid fa-eye" id="toggle-icon-login-password"></i>
                        </button>
                    </div>
                </div>

                <div id="otp-field" class="hidden">
                    <label for="login-otp" class="block text-[10px] uppercase font-bold text-dash-secondary tracking-widest mb-1.5 px-1">Verification Code</label>
                    <input type="text" id="login-otp" placeholder="6-digit code" class="w-full bg-dash-secondary border border-dash rounded-xl p-3.5 text-sm focus:outline-none focus:border-[#6a26da] transition">
                    <p class="text-[10px] text-dash-secondary mt-2 px-1">Check your inbox for the login code.</p>
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full accent-gradient py-4 rounded-2xl font-bold text-sm shadow-lg hover:scale-[1.02] transition active:scale-[0.98] mt-4">
                    Login
                </button>

                <div class="text-center mt-4">
                    <button type="button" onclick="toggleAuthMode()" id="auth-mode-toggle" class="text-[10px] uppercase font-black text-[#6a26da] tracking-widest hover:underline">
                        Switch to Admin Code Login
                    </button>
                </div>
            </form>

            <div class="mt-8 pt-8 border-t border-dash text-center">
                <p class="text-sm text-dash-secondary">
                    New to PIDI? 
                    <a href="signup.html" class="text-[var(--text-primary)] font-bold hover:text-[#6a26da] transition ml-1">Create an account</a>
                </p>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        // STRICT ADMIN LIST
        const AUTHORIZED_ADMINS = ['officialprincedike@gmail.com', 'officialpidimarketing@gmail.com'];

        const displayAuthMessage = (elementId, message, type = 'info') => {
            const msgDiv = document.getElementById(elementId);
            if (!msgDiv) return;
            msgDiv.className = `p-3 rounded-xl text-sm mb-4 text-center ${type === 'success' ? 'bg-green-100 text-green-800' : type === 'error' ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800'}`;
            msgDiv.innerHTML = message;
            msgDiv.classList.remove('hidden');
        };

        const setButtonLoading = (button, isLoading, originalText) => {
            button.disabled = isLoading;
            button.innerHTML = isLoading ? `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...` : originalText;
        };

        let isOTPMode = false;
        let otpSent = false;

        window.toggleAuthMode = () => {
            isOTPMode = !isOTPMode;
            document.getElementById('password-field').classList.toggle('hidden', isOTPMode);
            document.getElementById('otp-field').classList.add('hidden');
            document.getElementById('auth-mode-toggle').innerText = isOTPMode ? "Switch to Password Login" : "Switch to Admin Code Login";
            document.getElementById('auth-submit-btn').innerText = isOTPMode ? "Send Code" : "Login";
            otpSent = false;
        };

        async function handleAuthAction(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const submitButton = e.target.querySelector('button[type="submit"]');
            const msgDiv = document.getElementById('login-message');

            if (msgDiv) msgDiv.classList.add('hidden');

            if (!isOTPMode) {
                // REGULAR LOGIN (Performers/Creators)
                const password = document.getElementById('login-password').value;
                setButtonLoading(submitButton, true, 'Login');
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    displayAuthMessage('login-message', error.message, 'error');
                    setButtonLoading(submitButton, false, 'Login');
                } else {
                    if (AUTHORIZED_ADMINS.includes(email)) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }
            } else {
                // ADMIN OTP LOGIN
                
                // 1. Unauthorized email check
                if (!AUTHORIZED_ADMINS.includes(email)) {
                    displayAuthMessage('login-message', "Access Denied: You are not an authorized admin.", 'error');
                    return;
                }

                if (!otpSent) {
                    // Step 1: Send the 6-digit code to email
                    setButtonLoading(submitButton, true, 'Sending Code...');
                    const { error } = await supabase.auth.signInWithOtp({ 
                        email,
                        options: { shouldCreateUser: false } 
                    });
                    
                    if (error) {
                        displayAuthMessage('login-message', "Error sending code. Ensure you have an account.", 'error');
                        setButtonLoading(submitButton, false, 'Send Code');
                    } else {
                        otpSent = true;
                        document.getElementById('otp-field').classList.remove('hidden');
                        setButtonLoading(submitButton, false, 'Verify Code');
                        displayAuthMessage('login-message', "A verification code has been sent to your inbox.", 'success');
                    }
                } else {
                    // Step 2: Verify the 6-digit code
                    const token = document.getElementById('login-otp').value.trim();
                    if (!token) {
                        displayAuthMessage('login-message', "Please enter the verification code.", 'error');
                        return;
                    }

                    setButtonLoading(submitButton, true, 'Verifying...');
                    const { error } = await supabase.auth.verifyOtp({
                        email,
                        token,
                        type: 'email'
                    });

                    if (error) {
                        displayAuthMessage('login-message', "Invalid code. Please try again.", 'error');
                        setButtonLoading(submitButton, false, 'Verify Code');
                    } else {
                        window.location.href = 'admin.html';
                    }
                }
            }
        }

        const toggleTheme = () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeIcon();
            updateLogo();
        }
        
        const updateLogo = () => {
            const logo = document.getElementById('logo-img');
            if (!logo) return;
            logo.src = document.body.classList.contains('light-mode') ? 'assets/pidi.png' : 'assets/pidiblack.png';
        }
        
        const updateThemeIcon = () => {
            const icon = document.querySelector('#theme-icon');
            if (!icon) return;
            icon.classList.toggle('fa-moon', !document.body.classList.contains('light-mode'));
            icon.classList.toggle('fa-sun', document.body.classList.contains('light-mode'));
        }

        const togglePassword = (id) => {
            const input = document.getElementById(id);
            const icon = document.getElementById('toggle-icon-' + id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            updateThemeIcon();
            updateLogo();
        }
        
        window.handleAuthAction = handleAuthAction;
        window.toggleTheme = toggleTheme;
        window.togglePassword = togglePassword;
    </script>
</body>
</html>
